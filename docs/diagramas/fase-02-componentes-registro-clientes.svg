<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
 <title id="title">Fase 02 · Componentes de registro de clientes</title><desc id="desc">Flujo del formulario Vue hacia facades, repositories, API Flask, MySQL y almacenamiento de fotografías; autorización de rol y taller por sesión.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4263a6"/></marker><style>.box{fill:#fff;stroke:#7c9bd5;stroke-width:2;rx:12}.title{font:700 17px Arial;fill:#17345e}.sub{font:14px Arial;fill:#516581}.link{stroke:#4263a6;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.label{font:13px Arial;fill:#334d73}.zone{fill:#f1f5fc;stroke:#c9d5e6;stroke-width:1.5;rx:18}</style></defs>
 <rect width="1400" height="760" fill="#f8faff"/><text x="40" y="48" class="title" style="font-size:25px">Fase 02 · Registro de clientes</text><text x="40" y="76" class="sub">Arquitectura implementada y contrato pendiente con el login existente</text>
 <rect class="zone" x="30" y="112" width="285" height="570"/><text x="50" y="145" class="title">Frontend Vue</text>
 <rect class="box" x="60" y="195" width="225" height="82"/><text class="title" x="82" y="229">Vista de clientes</text><text class="sub" x="82" y="253">index.html · formulario/validación</text>
 <rect class="box" x="60" y="330" width="225" height="82"/><text class="title" x="91" y="364">ClienteFacade</text><text class="sub" x="80" y="388">reglas y notificaciones</text>
 <rect class="box" x="60" y="465" width="225" height="82"/><text class="title" x="77" y="499">ClienteRepository</text><text class="sub" x="73" y="523">fetch REST + cookie sesión</text>
 <path class="link" d="M172 278v45"/><path class="link" d="M172 413v45"/>
 <rect class="zone" x="350" y="112" width="370" height="570"/><text x="370" y="145" class="title">Backend REST · Flask</text>
 <rect class="box" x="390" y="195" width="290" height="82"/><text class="title" x="416" y="229">/api/clientes</text><text class="sub" x="413" y="253">POST · GET · PUT · foto · duplicado</text>
 <rect class="box" x="390" y="330" width="290" height="82"/><text class="title" x="416" y="364">Guard de sesión y rol</text><text class="sub" x="411" y="388">admin / secretaria / recepción</text>
 <rect class="box" x="390" y="465" width="290" height="82"/><text class="title" x="425" y="499">ClienteFacade (backend)</text><text class="sub" x="417" y="523">validación · negocio · aislamiento taller</text>
 <rect class="box" x="390" y="575" width="290" height="74"/><text class="title" x="425" y="607">ClienteRepository (backend)</text><text class="sub" x="424" y="630">SQL parametrizado / transacciones</text>
 <path class="link" d="M535 278v45"/><path class="link" d="M535 413v45"/><path class="link" d="M535 548v20"/>
 <path class="link" d="M286 506 C330 506 342 235 382 235"/><text class="label" x="305" y="365">HTTP JSON / multipart</text>
 <rect class="zone" x="760" y="112" width="290" height="570"/><text x="780" y="145" class="title">Sesión y datos</text>
 <rect class="box" x="790" y="195" width="230" height="95"/><text class="title" x="817" y="229">Login actual</text><text class="sub" x="810" y="253">solo vista de demostración</text><text class="sub" x="810" y="273">PENDIENTE: sesión firmada</text>
 <rect class="box" x="790" y="370" width="230" height="95"/><text class="title" x="827" y="404">MySQL local</text><text class="sub" x="811" y="428">empresas · talleres · clientes</text><text class="sub" x="811" y="448">taller_id desde sesión</text>
 <path class="link" d="M680 236h101"/><text class="label" x="688" y="220">sesión</text><path class="link" d="M680 611h101"/>
 <rect class="zone" x="1090" y="112" width="280" height="570"/><text x="1110" y="145" class="title">Archivos</text>
 <rect class="box" x="1120" y="370" width="220" height="95"/><text class="title" x="1150" y="404">Fotografías</text><text class="sub" x="1140" y="428">storage/clientes/</text><text class="sub" x="1140" y="448">BD conserva foto_ruta</text>
 <path class="link" d="M680 510 C860 510 945 415 1110 415"/><text class="label" x="850" y="476">multipart validado</text>
 <text class="sub" x="40" y="720">Límite real: el login de fase 1 no establece usuario/rol/taller; el guard API rechaza sin sesión.</text>
